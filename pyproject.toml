[tool.poetry]
name = "swag-labs-login-tests"
version = "0.1.0"
description = "Pruebas funcionales de inicio de sesion para SauceDemo"
authors = ["Gabriel Ramirez"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12"
selenium = ">=4.36.0,<5.0.0"
pytest = ">=8.4.2,<9.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["pruebas"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = "-ra"
